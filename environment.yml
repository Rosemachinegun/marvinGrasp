name: graspdemo

channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - defaults

dependencies:
  # ROS 2 Humble's Ubuntu packages are built for Python 3.10.
  - python=3.10.14
  - pip>=23
  - cuda-toolkit=11.8
  - cmake>=3.22
  - make
  # CUDA 11.8 supports GCC 11; newer host compilers can break pointnet2 builds.
  - gcc_linux-64=11
  - gxx_linux-64=11
  - pip:
      - -r requirements.txt
